                d[p] = d[p + 1] = d[p + 2] = g;
                d[p + 3] = 255;
            }
        }
        ctx.putImageData(image, 0, 0);
    }

    // Repère la carte dans la photo grâce à son vert : centre, taille et inclinaison.
    // Méthode : on cherche l'inclinaison pour laquelle la zone verte tient dans le plus petit rectangle
    // (les bords haut, droit et bas de la zone verte sont ceux de la carte).
    // Renvoie null si aucune zone verte plausible (carte d'un autre modèle, nappe verte, photo sans carte).
    function trouverCarte(source) {
        var cote = Math.max(source.width, source.height), ech = Math.min(1, 320 / cote);
        var W = Math.max(1, Math.round(source.width * ech)), H = Math.max(1, Math.round(source.height * ech));
        var c = document.createElement('canvas');
        c.width = W; c.height = H;
        var ctx = c.getContext('2d');
        ctx.drawImage(source, 0, 0, W, H);
        var d = ctx.getImageData(0, 0, W, H).data, px = [], py = [], x, y, i = 0;
        for (y = 0; y < H; y++) {
            for (x = 0; x < W; x++, i += 4) {
                var r = d[i], g = d[i + 1], b = d[i + 2];
                if (g > 40 && g > r * OCR.vert && g > b * OCR.vert) { px.push(x); py.push(y); }
            }
        }
        var n = px.length;
        if (n < W * H * 0.02) return null;

        var taille = 2 * (W + H) + 4, decal = W + H + 2, hu = new Uint32Array(taille), hv = new Uint32Array(taille);
        // Étendue de la zone verte le long d'une direction, sans les 1 % de points isolés de chaque côté
        function bornes(histo) {
            var seuil = n * 0.01, cumul = 0, bas = 0, haut = taille - 1, k;
            for (k = 0; k < taille; k++) { cumul += histo[k]; if (cumul > seuil) { bas = k; break; } }
            for (cumul = 0, k = taille - 1; k >= 0; k--) { cumul += histo[k]; if (cumul > seuil) { haut = k; break; } }
            return [bas - decal, haut - decal];
        }
        function mesurer(degres) {
            var a = degres * Math.PI / 180, co = Math.cos(a), si = Math.sin(a), k;
            for (k = 0; k < taille; k++) { hu[k] = 0; hv[k] = 0; }
            for (k = 0; k < n; k++) {
                hu[Math.round(px[k] * co + py[k] * si) + decal]++;
                hv[Math.round(py[k] * co - px[k] * si) + decal]++;
            }
            var u = bornes(hu), v = bornes(hv);
            return { angle: degres, u: u, v: v, aire: (u[1] - u[0] + 1) * (v[1] - v[0] + 1) };
        }
        var meilleur = null, m, t;
        for (t = -45; t < 45; t += 3) { m = mesurer(t); if (!meilleur || m.aire < meilleur.aire) meilleur = m; }
        var centre = meilleur.angle;
        for (t = centre - 2.5; t <= centre + 2.5; t += 0.5) { m = mesurer(t); if (m.aire < meilleur.aire) meilleur = m; }

        var du = meilleur.u[1] - meilleur.u[0] + 1, dv = meilleur.v[1] - meilleur.v[0] + 1;
        var grand = Math.max(du, dv), petit = Math.min(du, dv), rapport = grand / petit;
        if (rapport < 1.2 || rapport > 2.0) return null;                  // une carte fait 1,59 de large pour 1 de haut
        if (n / (du * dv) < 0.45) return null;                            // zone pleine, pas des taches vertes éparpillées
        if (du * dv > W * H * 0.9) return null;                           // tout est vert (nappe) : inutile
        var a = meilleur.angle * Math.PI / 180, um = (meilleur.u[0] + meilleur.u[1]) / 2, vm = (meilleur.v[0] + meilleur.v[1]) / 2;
        return {
            cx: (um * Math.cos(a) - vm * Math.sin(a)) / ech, cy: (um * Math.sin(a) + vm * Math.cos(a)) / ech,
            largeur: grand / ech, hauteur: petit / ech,
            angle: du >= dv ? meilleur.angle : meilleur.angle + 90       // direction du grand côté
        };
    }

    // Photo entière : redimensionnée, tournée de 0 / 90 / 180 / 270, puis égalisée
    function preparerImage(source, rotation) {
        var w = source.width, h = source.height, cote = Math.max(w, h);
        var echelle = cote > OCR.tailleMax ? OCR.tailleMax / cote : (cote < 1000 ? 1200 / cote : 1);
        var lw = Math.round(w * echelle), lh = Math.round(h * echelle), tourne = rotation % 180 !== 0;
        var canvas = document.createElement('canvas');
        canvas.width = tourne ? lh : lw;
        canvas.height = tourne ? lw : lh;
        var ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rotation * Math.PI / 180);
        ctx.drawImage(source, -lw / 2, -lh / 2, lw, lh);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        egaliser(ctx, canvas.width, canvas.height);
        return canvas;
    }

    // Carte seule : recadrée, redressée, agrandie, puis égalisée. demiTour = carte tenue à l'envers.
    function preparerCarte(source, carte, demiTour, largeur) {
        var echelle = Math.min(3, (largeur || OCR.largeurCarte) / carte.largeur);
        var W = Math.round(carte.largeur * OCR.marge * echelle), H = Math.round(carte.hauteur * OCR.marge * echelle);
        var canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W, H);
        ctx.translate(W / 2, H / 2);
        ctx.rotate((demiTour ? 180 - carte.angle : -carte.angle) * Math.PI / 180);
        ctx.scale(echelle, echelle);
        ctx.drawImage(source, -carte.cx, -carte.cy);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        egaliser(ctx, W, H);
        return canvas;
    }

    /* Lecture complète d'une photo. Renvoie { nir, nom } (nir = null si rien de sûr).
       1) Carte repérée : lue recadrée et redressée, à l'endroit, puis à l'envers si aucun mot de la
          carte n'a été reconnu ; ensuite deux autres lectures (texte épars, puis plus grand).
       2) Sinon, ou si rien de valide : photo entière, dans les 4 sens.
       Chaque lecture ne sert que si la précédente n'a pas donné de N° Sécu à clé valide. */
    function lirePhoto(worker, source) {
        var debut = Date.now(), carte = trouverCarte(source), lectures = 0;
        function arret() { return { nir: null, nom: null, endroit: false, stop: true, lectures: lectures }; }
        function lire(nom, psm, image) {
            // Photo illisible : on s'arrête après un délai raisonnable plutôt que de tout essayer
            var reste = OCR.delaiMax - (Date.now() - debut), minuteur;
            if (lectures > 0 && reste <= 0) return Promise.resolve(arret());
            lectures++;
            var lecture = worker.setParameters({ tessedit_pageseg_mode: psm }).then(function () {
                return worker.recognize(image());
            }).then(function (r) {
                var texte = r.data.text || '', resultat = analyserTexteCarte(texte);
                // Mots imprimés sur toutes les cartes : s'ils sont lus, la carte est dans ce sens
                resultat.endroit = /mise le|vitale|assurance|maladie/i.test(texte);
                resultat.etape = nom;
                resultat.lectures = lectures;
                return resultat;
            });
            // Une lecture interminable (photo très bruitée) est coupée : l'outil sera relancé à la prochaine photo
            var limite = new Promise(function (resolve) {
                minuteur = setTimeout(function () {
                    ocrWorker = null;
                    try { worker.terminate(); } catch (e) { /* déjà arrêté */ }
                    resolve(arret());
                }, Math.max(4000, reste));
            });
            return Promise.race([lecture, limite]).then(function (r) { clearTimeout(minuteur); return r; });
        }
        // Enchaîne des lectures jusqu'à la première qui donne un N° Sécu
        function suite(liste, i) {
            if (i >= liste.length) return Promise.resolve({ nir: null, nom: null, lectures: lectures });
            return liste[i]().then(function (r) { return r.nir || r.stop ? r : suite(liste, i + 1); });
        }
        function photoEntiere() {
            return suite(OCR.essais.map(function (e) {
                return function () { return lire('photo ' + e.rotation + '°', e.psm, function () { return preparerImage(source, e.rotation); }); };
            }), 0);
        }
        if (!carte) return photoEntiere();

        function carteLue(nom, psm, demiTour, largeur) {
            return lire(nom, psm, function () { return preparerCarte(source, carte, demiTour, largeur); });
        }
        function autres(demiTour) {
            return [
                function () { return carteLue('carte, texte épars', '11', demiTour); },
                function () { return carteLue('carte agrandie', '3', demiTour, Math.round(OCR.largeurCarte * 1.27)); }
            ];
        }
        return carteLue('carte', '3', false).then(function (endroit) {
            if (endroit.nir || endroit.stop) return endroit;
            // Les mots de la carte ont été lus : elle est à l'endroit, inutile d'essayer à l'envers
            if (endroit.endroit) return suite(autres(false).concat([photoEntiere]), 0);
            return carteLue('carte à l\'envers', '3', true).then(function (envers) {
                if (envers.nir || envers.stop) return envers;
                // Sens inconnu (aucun mot reconnu) : les lectures suivantes se font dans les deux sens
                var liste = envers.endroit ? autres(true) : autres(false).concat(autres(true));
                return suite(liste.concat([photoEntiere]), 0);
            });
        });
    }

    function lireCarte(fichier) {
        if (etat.ocrEnCours) return;
        etat.ocrEnCours = true;
        $('btnPhoto').disabled = true;
        statutOCR('Préparation de l\'outil de lecture…', '');

        var worker, source, formulaire = etat.formulaireId;
        function toujoursLeMemeFormulaire() { return formulaire === etat.formulaireId; }
        chargerOCR().then(function (w) {
            worker = w;
            statutOCR('Lecture de la carte…', '');
            return chargerImage(fichier);
        }).then(function (s) {
            source = s;
            return lirePhoto(worker, source);
        }).then(function (r) {
            if (!toujoursLeMemeFormulaire()) return;   // patient ajouté/annulé pendant la lecture
            if (!r.nir) {
                statutOCR('⚠️ Carte non lue. Reprenez la photo à plat, bien éclairée, sans reflet, ou saisissez à la main.', 'ko');
                return;
            }
            $('numSecu').value = r.nir;
            surSaisieNir();
            var nomRempli = false;
            if (r.nom && !$('nomPrenom').value.trim()) { $('nomPrenom').value = r.nom; nomRempli = true; }
            majNomComplet();
            var message = nomRempli ? '✓ Carte lue. Vérifiez le nom.' :
                (r.nom ? '✓ N° Sécu lu (nom déjà saisi, non modifié).' : '✓ N° Sécu lu. Nom non lu, saisissez-le.');
            statutOCR(message + ' Enfant de moins de 16 ans ? La carte est celle du parent : corrigez le nom et cochez l\'âge.', 'ok');
            majApercu();
        }).catch(function (e) {
            if (!toujoursLeMemeFormulaire()) return;
            statutOCR(e && e.telechargement
                ? '⚠️ Première utilisation : du réseau est nécessaire pour télécharger l\'outil de lecture (5 Mo). Réessayez avec du réseau.'
                : '⚠️ Lecture impossible (' + (e && e.message ? e.message : 'erreur') + '). Saisissez à la main.', 'ko');
        }).then(function () {
            etat.ocrEnCours = false;
            $('btnPhoto').disabled = false;
        });
    }

    /* =====================================================================
       HORS LIGNE (service worker) + bandeau de mise à jour
       ===================================================================== */

    function initHorsLigne() {
        if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
        var avaitUnControleur = !!navigator.serviceWorker.controller, rechargement = false;

        navigator.serviceWorker.register('sw.js').then(function (reg) {
            function proposerMiseAJour(worker) {
                var bandeau = $('updateBanner');
                bandeau.classList.remove('hidden');
                bandeau.onclick = function () { worker.postMessage('skipWaiting'); };
            }
            if (reg.waiting && avaitUnControleur) proposerMiseAJour(reg.waiting);
            reg.addEventListener('updatefound', function () {
                var w = reg.installing;
                if (!w) return;
                w.addEventListener('statechange', function () {
                    if (w.state === 'installed' && navigator.serviceWorker.controller) proposerMiseAJour(w);
                });
            });
        }).catch(function () { /* hors ligne non disponible : l'app fonctionne quand même */ });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!avaitUnControleur || rechargement) return;   // pas de rechargement à la toute première installation
            rechargement = true;
            location.reload();
        });
    }

       ÉVÉNEMENTS

        });

        $('ageMoins6').addEventListener('change', function () { if (this.checked) $('agePlus80').checked = false; etat.ageAuto = null; appliquerAge(); });
        $('agePlus80').addEventListener('change', function () { if (this.checked) $('ageMoins6').checked = false; etat.ageAuto = null; appliquerAge(); });

        $('de').addEventListener('input', majApercu);
        $('ikKm').addEventListener('input', majApercu);

        $('numSecu').addEventListener('input', surSaisieNir);
        Array.prototype.forEach.call(document.querySelectorAll('.nir-btn'), function (b) {
            b.addEventListener('click', function () {
                $('numSecu').value = nettoyerNir($('numSecu').value) + this.getAttribute('data-lettre');
                surSaisieNir();
                $('numSecu').focus();
            });
        });
        $('codeOrga').addEventListener('input', function () { this.value = formaterCodeOrga(this.value); });

        $('btnAjouter').addEventListener('click', ajouterPatient);
        $('btnAnnuler').addEventListener('click', annulerModification);
        $('liveBar').addEventListener('click', function () {
            $('recap').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        $('btnPhoto').addEventListener('click', function () { if (!etat.ocrEnCours) $('photoCarte').click(); });
        $('nomPrenom').addEventListener('input', majNomComplet);
        window.addEventListener('resize', majNomComplet);
        $('photoCarte').addEventListener('change', function () {
            var fichier = this.files && this.files[0];
            this.value = '';                      // permet de reprendre la même photo
            if (fichier) lireCarte(fichier);
        });
        $('patientList').addEventListener('click', function (e) {
            var bouton = e.target.closest ? e.target.closest('[data-action]') : null;
            if (!bouton) return;
            var id = Number(bouton.getAttribute('data-id'));
            if (bouton.getAttribute('data-action') === 'modifier') modifierPatient(id);
            else supprimerPatient(id);
        });

        $('creneauxSemaine').parentNode.addEventListener('change', function (e) {
            var id = e.target.getAttribute('data-creneau');
            if (!id) return;
            etat.creneaux[id] = e.target.checked;
            sauverCreneaux();
            majTotaux();
        });

        $('dateInput').addEventListener('click', function () {
            try { if (this.showPicker) this.showPicker(); } catch (e) { /* sélecteur natif au toucher */ }
        });
        $('dateInput').addEventListener('change', function () {
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(this.value);
            if (m) {
                etat.dateGarde = new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0);
                sauverDate();
                afficherCreneaux();
            }
            afficherDate();
            afficherGardeOubliee();
        });

        $('btnGardeContinuer').addEventListener('click', continuerGarde);
        $('btnGardeNouvelle').addEventListener('click', function () {
            reinitialiser('Démarrer une nouvelle garde ? La garde du ' + dateCourte(dateDeGarde()) +
                ' reste récupérable ' + SAUVEGARDE_JOURS + ' jours (bouton Restaurer).');
        });

        $('btnReinit').addEventListener('click', reinitialiser);
        $('btnRestaurer').addEventListener('click', restaurer);
        $('btnPDF').addEventListener('click', telechargerPDF);
        $('btnPartager').addEventListener('click', partagerPDF);

        $('patho').addEventListener('change', choisirExamen);
        $('btnCopier').addEventListener('click', copierExamen);

        setInterval(verifierMomentAuto, 60000);
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) return;
            verifierMomentAuto();
            afficherGardeOubliee();      // l'app peut rester ouverte plusieurs jours
            afficherRestauration();      // efface la copie de secours périmée
        });
    }

    /* =====================================================================
       DÉMARRAGE
       ===================================================================== */

    (function demarrer() {
        $('appVersion').textContent = 'v' + APP_VERSION;
        $('cotationGrid').innerHTML = GRILLE.map(function (ligne) {
            return ligne.map(function (code) {
                if (!code) return '<div></div>';
                return '<div class="cotation-item" id="item' + code + '">' +
                    '<input type="checkbox" id="cot' + code + '" data-code="' + code + '">' +
                    '<label for="cot' + code + '"><span>' + code + '</span><small>' + formatTarif(TARIFS[code]) + '</small></label>' +
                '</div>';
            }).join('');
        }).join('');
        construireCreneaux();
        construireExamens();
        chargerEtat();
        brancherEvenements();
        rafraichirTout();
        nouveauPatient();
        initHorsLigne();
    })();
    </script>
</body>
</html>
